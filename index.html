function lineChart(pts, compact){
  if (pts.length < 2) return '<div class="empty">至少完成 2 轮练习后即可看到走势曲线。</div>';
  const W = compact ? 358 : 720, H = compact ? 208 : 260;
  const L = compact ? 30 : 44, R = compact ? 10 : 14, T = compact ? 14 : 16, B = compact ? 24 : 30;
  const fs = compact ? 9 : 11, fsx = compact ? 8.5 : 10.5;
  const maxLabels = compact ? 4 : 6;
  const iw = W - L - R, ih = H - T - B;
  const X = i => L + (pts.length === 1 ? iw/2 : i/(pts.length-1)*iw);
  const Y = v => T + (1 - v/100)*ih;
  const p = [];
  p.push('<svg class="chart-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">');
  for (let v = 0; v <= 100; v += 25){
    p.push('<line x1="'+L+'" y1="'+Y(v)+'" x2="'+(W-R)+'" y2="'+Y(v)+'" stroke="#eceefa" stroke-width="1"/>');
    p.push('<text x="'+(L-7)+'" y="'+(Y(v)+4)+'" font-size="'+fs+'" fill="#9aa0bd" text-anchor="end">'+v+'%</text>');
  }
  /* 目标线 80% */
  p.push('<line x1="'+L+'" y1="'+Y(80)+'" x2="'+(W-R)+'" y2="'+Y(80)+'" stroke="#0f9d76" stroke-width="1.2" stroke-dasharray="5 5" opacity=".55"/>');
  p.push('<text x="'+(W-R)+'" y="'+(Y(80)-5)+'" font-size="'+fsx+'" fill="#0f9d76" text-anchor="end">目标 80%</text>');
  /* 面积 */
  let area = 'M '+X(0)+' '+Y(0);
  pts.forEach((d,i) => { area += ' L '+X(i)+' '+Y(d.y); });
  area += ' L '+X(pts.length-1)+' '+Y(0)+' Z';
  p.push('<defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="#5b53e8" stop-opacity=".26"/>'+
    '<stop offset="100%" stop-color="#5b53e8" stop-opacity="0"/></linearGradient></defs>');
  p.push('<path d="'+area+'" fill="url(#lg)"/>');
  /* 移动平均 */
  const ma = pts.map((d,i) => {
    const seg = pts.slice(Math.max(0, i-2), i+1);
    return seg.reduce((a,b) => a+b.y, 0)/seg.length;
  });
  p.push('<path d="'+ma.map((v,i) => (i?'L':'M')+' '+X(i)+' '+Y(v)).join(' ')+'" fill="none" stroke="#e08a0b" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round"/>');
  /* 主线 */
  p.push('<path d="'+pts.map((d,i) => (i?'L':'M')+' '+X(i)+' '+Y(d.y)).join(' ')+'" fill="none" stroke="#5b53e8" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>');
  /* 点 */
  pts.forEach((d,i) => {
    p.push('<circle cx="'+X(i)+'" cy="'+Y(d.y)+'" r="'+(compact?3.4:4.2)+'" fill="#fff" stroke="#5b53e8" stroke-width="2.4">'+
      '<title>'+fmtDate(d.x)+' · '+modeInfo(d.mode).name+' · '+d.y+'%（'+d.total+'题）</title></circle>');
  });
  /* 标注最新 */
  const li = pts.length-1;
  p.push('<text x="'+X(li)+'" y="'+(Y(pts[li].y)-9)+'" font-size="'+(compact?10.5:12)+'" font-weight="700" fill="#5b53e8" text-anchor="end">'+pts[li].y+'%</text>');
  /* x 轴 */
  const step = Math.max(1, Math.ceil(pts.length/maxLabels));
  pts.forEach((d,i) => {
    if (i % step && i !== li) return;
    const dt = new Date(d.x);
    p.push('<text x="'+X(i)+'" y="'+(H-7)+'" font-size="'+fsx+'" fill="#9aa0bd" text-anchor="middle">'+(dt.getMonth()+1)+'/'+dt.getDate()+'</text>');
  });
  p.push('</svg>');
  return p.join('');
}
function activityBars(){
  const pairs = recSessions(Records.filter);
  const days = 14, today = new Date(); today.setHours(0,0,0,0);
  const arr = [];
  for (let i = days-1; i >= 0; i--){
    const d = new Date(today.getTime() - i*86400000);
    const next = d.getTime() + 86400000;
    const n = pairs.filter(p => p.s.startedAt >= d.getTime() && p.s.startedAt < next)
      .reduce((a,p) => a + p.items.length, 0);
    arr.push({label:(d.getMonth()+1)+'/'+d.getDate(), n:n});
  }
  const max = Math.max(1, Math.max.apply(null, arr.map(a => a.n)));
  return '<div class="activity">' + arr.map(a => {
    const hp = a.n ? Math.max(6, Math.round(a.n/max*100)) : 0;
    return '<div class="acol" title="'+a.label+'：'+a.n+' 题">'+
      '<span class="abox">'+(a.n ? '<i style="height:'+hp+'%"></i>' : '')+'</span>'+
      '<b>'+(a.label)+'</b></div>';
  }).join('') + '</div><p class="hint" style="margin-top:6px">柱高表示当天在该分类下完成的题量</p>';
}
/* 易错题型 + 易混淆对照 */
function weakAndConfusedHTML(items){
  if (!items.length) return '<div class="empty">暂无数据</div>';

    if (!map[k]) map[k] = {label: it.correctText, mode:it.mode, n:0, ok:0};
    map[k].n++; if (it.ok) map[k].ok++;
  });
  const weak = Object.keys(map).map(k => map[k]).filter(g => g.n >= 2)
    .map(g => ({
      label: (broad ? modeInfo(g.mode).name + '·' : '') + g.label,
      n: g.n, acc: Math.round(g.ok/g.n*100)
    }))
    .sort((a,b) => a.acc - b.acc).slice(0, 5);
  const conf = recConfusions(items, 6);
  const h = [];
  h.push('<div class="rec-sub">正确率最低的题型</div>');
  if (!weak.length){
    h.push('<div class="empty" style="padding:14px 12px">同一题型再练几题就能识别薄弱项</div>');
  } else {
    h.push('<div class="hbar">');

      h.push('<div class="hrow"><span class="hlabel" title="'+esc(g.label)+'">'+esc(g.label)+'</span>'+
        '<span class="track"><i style="width:'+Math.max(3,g.acc)+'%;background:'+accColor(g.acc)+'"></i></span>'+
        '<span class="val">'+g.acc+'%<br><span style="font-size:10px;color:var(--muted)">'+g.n+'题</span></span></div>');
    });
    h.push('</div>');
  }
  h.push('<div class="rec-sub">最容易混淆</div>');
  if (!conf.length){
    h.push('<div class="empty" style="padding:14px 12px">还没有答错记录，保持住</div>');
  } else {
    h.push('<div class="conflist">' + conf.map(c =>
      '<div class="confline"><code>'+esc(c.correct)+'</code>'+
      '<span class="arrow">→</span><code class="bad">'+esc(c.user)+'</code>'+
      '<span class="n">'+c.n+' 次</span></div>').join('') + '</div>'+
      '<p class="hint" style="margin-top:9px">左边是正确答案，右边是你误选/误听的答案</p>');
  }
  return h.join('');
}

function exportJSON(){
  const data = {exportedAt:new Date().toISOString(), settings:Store.settings, sessions:Store.sessions};

/* 把任意来源的数据规整为有效 session 数组（去文件内重复 id、补全 id） */
function normalizeImport(data){
  const sessions = Array.isArray(data) ? data
    : (data && Array.isArray(data.sessions) ? data.sessions : null);
  if (!sessions) return null;
  const valid = [], seen = {};
  sessions.forEach(s => {
    if (s && typeof s === 'object' && Array.isArray(s.items) && (s.mode || s.items.length)){
      if (!s.id) s.id = 'imp' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
      if (seen[s.id]) return;
      seen[s.id] = 1; valid.push(s);
    }
  });
  return valid;
}
/* 与本地记录按 id 合并，可选套用设置；返回新增轮数 */
function mergeImported(data){
  const valid = normalizeImport(data);
  if (!valid) return {added:0, ok:false};
  const have = {};
  Store.sessions.forEach(s => { if (s && s.id) have[s.id] = 1; });
  let added = 0;
  valid.forEach(s => { if (!have[s.id]){ Store.sessions.unshift(s); added++; } });
  if (Store.sessions.length > 400) Store.sessions.length = 400;
  let appliedSet = false;
  if (data && data.settings && typeof data.settings === 'object'){
    Store.settings = Object.assign({}, DEFAULT_SETTINGS, data.settings);
    if (Store.settings.mode === 'read') Store.settings.mode = Store.settings.readType === 'interval' ? 'readiv' : 'readnote';
    appliedSet = true;
  }
  Store.save();
  if (appliedSet) Store.saveSettings();
  return {added:added, ok:true, appliedSet:appliedSet};
}
function importJSON(){
  const inp = $('#fileImport'); if (!inp) return;
  inp.value = '';
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      let data;
      try { data = JSON.parse(reader.result); }
      catch(e){ toast('文件不是有效的 JSON'); return; }
      const r = mergeImported(data);
      if (!r.ok){ toast('文件中没有可导入的练习记录'); return; }
      applyTheme(Store.settings.themeColor);
      renderSettingsStatic(); renderModeOpts(); renderModebar();
      renderRecords();
      toast('已导入 ' + r.added + ' 轮记录' + (r.appliedSet ? ' 与设置' : ''));
    };
    reader.readAsText(f);
  };
  inp.click();
}

function wireTools(){
  buildToolKeyboard();
  /* 胶囊按钮统一走事件委托 */
  const root = $('#toolsRoot');
  if (root && !root._delegated){
    root._delegated = true;
    root.addEventListener('click', e => {
      const b = e.target.closest ? e.target.closest('[data-tool]') : null;
      if (!b) return;
      const kind = b.dataset.tool, val = b.dataset.val, st = Store.settings;
      if (kind === 'clef'){ st.clef = val; Store.saveSettings(); }

      else if (kind === 'chordId'){ Tools.chord.id = val; }
      else if (kind === 'chordStyle'){ Tools.chord.style = val; }
      else if (kind === 'kblabel'){ st.toolLabel = val; Store.saveSettings(); renderTools(); return; }
      else if (kind === 'iv'){ Tools.iv = Number(val); }
      const group = b.parentElement;
      if (group) $$('[data-tool="'+kind+'"]', group).forEach(x => x.classList.toggle('on', x === b));
      if (kind === 'clef') refreshReadTool();

  };

  const cr = $('#toolChordRoot');

function toolRoll(){
  const st = Store.settings;
  const pool = notePool({natural: st.accid === 'natural'});
  let m = pick(pool), guard = 0;
  while (m === Tools.read.midi && guard++ < 20) m = pick(pool);

  clearToolMarks();
  refreshReadTool();
}
/* 播放并在展示条上依次点亮所弹的音 */
const stripTimers = {};
function stripClearAll(){
  Object.keys(stripTimers).forEach(k => {
    (stripTimers[k] || []).forEach(t => clearTimeout(t));
    stripTimers[k] = [];
  });
  $$('.note-strip .nc').forEach(c => c.classList.remove('on'));
}
function stripPlay(stripId, notes, opt, label){
  Audio2.resume(); Audio2.stopAll(); stripClearAll();
  if (!stripTimers[stripId]) stripTimers[stripId] = [];
  const box = $(stripId);
  const chipsHTML = notes.map(n => '<span class="nc">'+fullName(n)+'</span>').join('');
  if (box) box.innerHTML = (label ? '<span class="nc plain">'+label+'</span>' : '') + chipsHTML;
  const ms = Audio2.play(notes, opt) || 700;
  const chips = box ? $$('.nc', box).filter(c => !c.classList.contains('plain')) : [];
  const gap = (opt.gap || .4) * 1000;
  if (opt.type === 'chord'){
    chips.forEach(c => c.classList.add('on'));
  } else {
    chips.forEach((c, i) => {
      stripTimers[stripId].push(setTimeout(() => {
        chips.forEach(x => x.classList.remove('on'));
        c.classList.add('on');
      }, i * gap));
    });
  }
  stripTimers[stripId].push(setTimeout(() => chips.forEach(c => c.classList.remove('on')), ms + 140));
}
function playToolScale(){
  const sc = SCALES[Tools.scale.type] || SCALES.major;
  const root = Number(($('#toolScaleRoot') || {}).value) || Tools.scale.root;
  Tools.scale.root = root;
  let notes = sc.iv.map(v => root + v);
  if (Tools.scale.dir === 'updown') notes = notes.concat(notes.slice(1, -1).reverse());
  stripPlay('#toolScaleNotes', notes, {type:'seq', dur:.5, gap:.36, vel:.8}, pname(root)+' '+sc.name);
}
function playToolChord(){
  const c = CHORD_BY_ID[Tools.chord.id] || CHORD_BY_ID.maj;
  const root = Number(($('#toolChordRoot') || {}).value) || Tools.chord.root;
  Tools.chord.root = root;
  const base = chordNotes(root, c.iv);
  const notes = Tools.chord.style === 'block' ? base
              : (Tools.chord.style === 'updown' ? base.concat(base.slice(1, -1).reverse()) : base);
  stripPlay('#toolChordNotes', notes, {
    type: Tools.chord.style === 'block' ? 'chord' : 'seq',
    dur: Tools.chord.style === 'block' ? 1.7 : .85, gap:.42, vel:.8
  }, fullName(root)+' '+c.cn);
}
function playToolIv(){
  const base = Store.settings.refMidi;
  const iv = INTERVALS.filter(x => x.s === Tools.iv)[0] || INTERVALS[6];
  stripPlay('#toolIvNotes', [base, base + Tools.iv], {type:'seq', dur:.95, gap:.72, vel:.85}, iv.cn);
}

function bindSettings(){

  $('#selLow').onchange = e => {
    const v = Number(e.target.value);

    Store.settings.lowMidi = v;
    $('#selHigh').value = Store.settings.highMidi;
    Store.saveSettings(); renderRangeHint(); syncChips(); renderStage();
  };
  $('#selHigh').onchange = e => {
    const v = Number(e.target.value);
    if (v < Store.settings.lowMidi) Store.settings.lowMidi = Math.max(33, v - 12);
    Store.settings.highMidi = v;
    $('#selLow').value = Store.settings.lowMidi;
    Store.saveSettings(); renderRangeHint(); syncChips(); renderStage();
  };

  $('#selRound').onchange = e => { Store.settings.perRound = Number(e.target.value); Store.saveSettings(); renderStage(); };

    b.onclick = () => {
      const span = Number(b.dataset.range);
      const st = Store.settings;
      let lo = nearestWhiteDown(st.lowMidi);
      let hi = lo + span - 1;
      if (hi > 96){ hi = 96; lo = 96 - span + 1; }
      st.lowMidi = Math.max(33, lo); st.highMidi = hi;
      $('#selLow').value = st.lowMidi; $('#selHigh').value = st.highMidi;

      else st.intervalSet.push(v);

  };
  const tb = $('#btnToggleSettings');
  if (tb) tb.onclick = (e) => { e.stopPropagation(); toggleSettingsPanel(); };
  $('#btnVol').onclick = toggleVolume;
}
function toggleSettingsPanel(){
  const p = $('#settingsPanel');
  p.classList.toggle('collapsed');
  const b = $('#btnToggleSettings');
  if (b) b.textContent = p.classList.contains('collapsed') ? '展开' : '收起';
}
function toggleVolume(){
  Audio2.resume();
  Audio2.muted = !Audio2.muted;
  if (Audio2.master) Audio2.master.gain.value = Audio2.muted ? 0 : Store.settings.volume;
  $('#btnVol').textContent = Audio2.muted ? '🔇' : '🔊';
  toast(Audio2.muted ? '已静音' : '已开启声音');
}
function bindKeys(){
  document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
    if (e.code === 'Space' || e.key === ' '){
      e.preventDefault();
      if (Quiz.live && Quiz.cur) Quiz.playQuestion();
      else { const s = $('#btnStart'); if (s) s.click(); }
      return;
    }
    if (e.key === 'Enter'){
      const n = $('#btnNext');
      if (n){ e.preventDefault(); Quiz.advance(); }
      return;
    }
    if (!Quiz.live || !Quiz.cur || Quiz.answered) return;
    if (e.key === 'r' || e.key === 'R'){ Audio2.stopAll(); Quiz.playRef(); return; }
    if (Quiz.cur.answer.type === 'degree' && /^[1-7]$/.test(e.key)){
      const btn = $('[data-ans="'+e.key+'"]');
      if (btn) btn.click();
    }
  });
}
let rzTimer = null;
function bindResize(){
  const onRz = () => {
    clearTimeout(rzTimer);
    rzTimer = setTimeout(() => {
      if ($('#keyboard')) Keyboard.build();
      /* 只在工具页可见时重建，隐藏时容器测不到宽度会画窄 */
      if ($('#toolKb') && $('#view-tools').classList.contains('on')) buildToolKeyboard();
      if ($('#view-records').classList.contains('on')) renderRecords();
    }, 150);
  };
  window.addEventListener('resize', onRz);
  window.addEventListener('orientationchange', () => setTimeout(onRz, 320));
}
function init(){
  Store.load();
  applyTheme(Store.settings.themeColor);
  Audio2.init();
  renderSettingsStatic();
  renderGroupTabs();
  renderModebar();
  renderModeOpts();
  renderStage();
  bindSettings();
  bindKeys();
  bindResize();
  $$('.tabs button').forEach(b => { b.onclick = () => switchView(b.dataset.view); });
  const panel = $('#settingsPanel');
  if (window.innerWidth <= 940) panel.classList.add('collapsed');
  const tb = $('#btnToggleSettings');
  if (tb) tb.textContent = panel.classList.contains('collapsed') ? '展开' : '收起';
  const unlock = () => {
    Audio2.resume();
    document.removeEventListener('pointerdown', unlock);
    document.removeEventListener('keydown', unlock);
  };
  document.addEventListener('pointerdown', unlock);
  document.addEventListener('keydown', unlock);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
</body>
</html>
